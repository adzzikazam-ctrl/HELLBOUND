<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELLBOUND CO.</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:black;
    color:white;
    font-family:Arial;
}

.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.logo{
    width:90px;
    margin-bottom:20px;
}

.card{
    background:#111;
    border:1px solid #333;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.03);
    border:1px solid white;
}

.card img{
    height:230px;
    object-fit:cover;
}

.cart-box{
    position:fixed;
    top:20px;
    right:20px;
    background:#111;
    border:1px solid white;
    padding:10px 15px;
    cursor:pointer;
    z-index:1000;
}

input,select{
    background:black !important;
    color:white !important;
    border:1px solid #444 !important;
}

</style>
</head>
<body>

<!-- HERO -->
<div class="hero" id="hero">

    <img src="hellhound/logo hell bound.png" class="logo">

    <h1 class="fw-bold display-3">HELLBOUND CO.</h1>

    <p class="text-secondary fs-4">FORGED FOR THE FEARLESS</p>

    <button class="btn btn-outline-light px-4" onclick="masuk()">
        SHOP NOW
    </button>

</div>

<!-- CART -->
<div class="cart-box" onclick="lihatCart()">
🛒 <span id="jumlahCart">0</span>
</div>

<!-- HOME -->
<div class="container py-5" id="home" style="display:none;">

    <button class="btn btn-outline-light mb-4" onclick="kembaliHero()">
        ← Back
    </button>

    <h1 class="text-center mb-5">CATEGORIES</h1>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card h-100 text-white" onclick="bukaProduk('Bracelet')">
                <img src="hellhound/gelang.png" class="card-img-top">
                <div class="card-body text-center">
                    <h4>Bracelet</h4>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card h-100 text-white" onclick="bukaProduk('Metal Ring')">
                <img src="hellhound/cincin.png" class="card-img-top">
                <div class="card-body text-center">
                    <h4>Metal Ring</h4>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card h-100 text-white" onclick="bukaProduk('Chain Necklace')">
                <img src="hellhound/kalung.png" class="card-img-top">
                <div class="card-body text-center">
                    <h4>Chain Necklace</h4>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card h-100 text-white" onclick="bukaProduk('Wallet Chain')">
                <img src="rantai celana.jpeg" class="card-img-top">
                <div class="card-body text-center">
                    <h4>Wallet Chain</h4>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- PRODUK -->
<div class="container py-5" id="produk" style="display:none;">

    <button class="btn btn-outline-light mb-4" onclick="kembali()">
        ← Back
    </button>

    <h1 class="text-center mb-5" id="judul"></h1>

    <div class="row g-4" id="listProduk"></div>

</div>

<!-- CART PAGE -->
<div class="container py-5" id="cartPage" style="display:none;">

    <button class="btn btn-outline-light mb-4" onclick="kembaliHome()">
        ← Back
    </button>

    <h1 class="text-center mb-5">CART</h1>

    <div id="isiCart"></div>

    <h3 class="mt-4" id="totalHarga">Total : Rp0</h3>

    <button class="btn btn-outline-light mt-3" onclick="checkout()">
        CHECKOUT
    </button>

</div>

<!-- CHECKOUT -->
<div class="container py-5" id="checkoutPage" style="display:none; max-width:500px;">

    <button class="btn btn-outline-light mb-4" onclick="lihatCart()">
        ← Back
    </button>

    <h1 class="text-center mb-4">CHECKOUT</h1>

    <input class="form-control mb-3" placeholder="Full Name">

    <input class="form-control mb-3" placeholder="Phone Numbet">

    <input class="form-control mb-3" placeholder="Email">

    <input class="form-control mb-3" placeholder="Adress">

    <input class="form-control mb-3" placeholder="Postal Code">

    <input class="form-control mb-3" placeholder="Home Benchmark">

    <select class="form-select mb-4">
        <option>Payment Method</option>
        <option>DANA</option>
        <option>OVO</option>
        <option>GoPay</option>
        <option>COD</option>
    </select>

    <button class="btn btn-outline-light w-100" onclick="selesai()">
        KIRIM PESANAN
    </button>

</div>

<script>

let cart = [];
let total = 0;

function masuk(){
    hero.style.display = 'none';
    home.style.display = 'block';
}

function kembaliHero(){
    home.style.display = 'none';
    hero.style.display = 'flex';
}

function card(nama,harga,img,desc){

return `
<div class="col-md-4">

<div class="card text-white h-100">

<img src="${img}" class="card-img-top">

<div class="card-body text-center">

<h4>${nama}</h4>

<p>${desc}</p>

<h5>Rp${harga}</h5>

<p>⭐⭐⭐⭐⭐</p>

<button class="btn btn-outline-light"
onclick="tambahCart('${nama}',${harga})">
Tambah
</button>

</div>
</div>
</div>
`;
}

function bukaProduk(kategori){

home.style.display = 'none';
produk.style.display = 'block';

judul.innerText = kategori;

let data = '';

if(kategori == 'Metal Ring'){

    data =
    card('Skull Ring',80000,'hellhound/skull ring.png','Cincin Silver Metal Tengkorak') +
    card('Iron Ring',70000,'hellhound/iron ring.png','Cincin Silver Metal Polos') +
    card('Dark Ring',85000,'hellhound/dark ring.png','Cincin Hitam Metal Polos');
}

if(kategori == 'Bracelet'){

    data =
    card('Skull Bracelet',120000,'hellhound/skullbracelet.png','Gelang Rantai Metal Silver Dengan Tengkorak') +
    card('Chain Bracelet',90000,'hellhound/chain bracelet.png','Gelang Rantai Metal') +
    card('Leather Bracelet',110000,'hellhound/leather bracelet.png','Gelang Kulit Dan Metal Hitam');
}

if(kategori == 'Chain Necklace'){

    data =
    card('Heavy Chain',150000,'hellhound/heavy chan.png','Rantai Silver Metal Tebal') +
    card('Silver Chain',130000,'hellhound/silver chan.png','Rantai silver Metal') +
    card('Dark Chain',140000,'hellhound/dark chan.png','Rantai Hitam Metal');
}

if(kategori == 'Wallet Chain'){

    data =
    card('Wallet Chain Skull',100000,'hellhound/wallet chain skull.png','Rantai Silver Metal Dengan Tengkorak') +
    card('Wallet Chain Heavy',120000,'hellhound/wallet chain heavy.png','Rantai Silver Metal') +
    card('Wallet Chain Dark',110000,'hellhound/wallet chain dark.png','Rantai Hitam Metal Dengan Tengkorak');
}

listProduk.innerHTML = data;
}

function tambahCart(nama,harga){

cart.push({nama,harga});

total += harga;

jumlahCart.innerText = cart.length;

alert('Produk ditambahkan!');
}

function lihatCart(){

home.style.display = 'none';
produk.style.display = 'none';
checkoutPage.style.display = 'none';
cartPage.style.display = 'block';

let data = '';

for(let i=0; i<cart.length; i++){

    data += `
    <div class="card p-3 mb-3 text-white">
        <h4>${cart[i].nama}</h4>
        <p>Rp${cart[i].harga}</p>
    </div>
    `;
}

isiCart.innerHTML = data;

totalHarga.innerText = 'Total : Rp' + total;
}

function checkout(){
    cartPage.style.display = 'none';
    checkoutPage.style.display = 'block';
}

function selesai(){
    alert('Pesanan berhasil dikirim!');
}

function kembali(){
    produk.style.display = 'none';
    home.style.display = 'block';
}

function kembaliHome(){
    cartPage.style.display = 'none';
    home.style.display = 'block';
}

</script>

</body>
</html>
